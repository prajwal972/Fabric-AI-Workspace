name: Fabric CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: fabric_test
          POSTGRES_PASSWORD: disposable_ci_test_only
          POSTGRES_DB: fabric_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fabric_test -d fabric_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fabric_test:disposable_ci_test_only@127.0.0.1:5432/fabric_test
      FABRIC_TEST_DATABASE_URL: postgresql://fabric_test:disposable_ci_test_only@127.0.0.1:5432/fabric_test
      REDIS_URL: redis://127.0.0.1:6379
      FABRIC_TEST_REDIS_URL: redis://127.0.0.1:6379
      FABRIC_MASTER_KEY: disposable-ci-master-key-32-characters
      FABRIC_TEST_MOCK: '1'
      FABRIC_UPLOAD_SCAN_MODE: optional
      FABRIC_DATA_DIR: /tmp/fabric-ci-runtime
      FABRIC_PUBLIC_URL: http://127.0.0.1:27889
      S3_ENDPOINT: http://127.0.0.1:29000
      FABRIC_TEST_S3_ENDPOINT: http://127.0.0.1:29000
      S3_BUCKET: fabric-tests
      S3_ACCESS_KEY_ID: fabric_test
      S3_SECRET_ACCESS_KEY: disposable_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Start real encrypted S3-compatible test storage
        run: bash integration/setup-storage.sh
      - run: npm run test:storage
      - run: npm run db:migrate
      - run: npm run test:postgres
      - run: npm run test:ai-policy
      - run: npm run test:worker:health
      - run: npm run test:runtime
      - run: npm run test:import
      - run: npm run test:sandbox:sql
      - run: npm run test:redis:failure
      - run: npm run test:backup:restore
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:runtime
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: integration-evidence, path: test-results/}
